# Local stack: MongoDB + API + UI. Secrets live in .env (git-ignored); copy .env.example to .env first.
# Usage: docker compose up --build   -> UI http://localhost:5173, API http://localhost:8000/docs
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"  # loopback only, for scripts/backup_mongo.ps1 and local tools
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/
    ports:
      - "8000:8000"
    volumes:
      - policy-store:/app/data/policy_store
      - vendor-quote-store:/app/data/vendor_quote_store
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000  # the browser calls the API on the host port
    restart: unless-stopped
    ports:
      - "5173:80"  # matches the default CORS_ALLOWED_ORIGINS
    depends_on:
      - api

volumes:
  mongo-data:
  policy-store:
  vendor-quote-store:
